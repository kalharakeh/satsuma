name: Build

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]  # publishing a release on GitHub builds and attaches the installer
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set version
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'release') { $v = $env:GITHUB_REF_NAME.TrimStart('v') }
          else { $v = ((Get-Content version.py) -replace '.*"(.*)".*', '$1') + "-dev" }
          "__version__ = `"$v`"" | Set-Content version.py
          "VERSION=$v" >> $env:GITHUB_ENV
          "NUMVERSION=$($v.Split('-')[0])" >> $env:GITHUB_ENV

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ai.txt pyinstaller

      - name: Smoke test (from source, on Windows)
        run: python tests/smoke_test.py --ai

      - name: Text-drag logic + mouse hook start-up
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python tests/test_textdrag.py
          python -c "import sys; from PySide6.QtWidgets import QApplication; app = QApplication([]); import hook; w = hook.DragWatcher({'text_drag': True, 'shift_drag': True}); err = w.start(); print('hook:', err or 'running'); w.stop(); sys.exit(1 if err else 0)"

      - name: Download FFmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ff.zip
          Expand-Archive ff.zip ff
          $exe = Get-ChildItem ff -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          New-Item -ItemType Directory build_bin -Force | Out-Null
          Copy-Item $exe.FullName build_bin\
          $lic = Get-ChildItem ff -Recurse -Filter LICENSE* | Select-Object -First 1
          if ($lic) { Copy-Item $lic.FullName build_bin\FFMPEG-LICENSE.txt }
          "FFmpeg build from https://www.gyan.dev/ffmpeg/builds/ - source: https://ffmpeg.org/download.html" | Set-Content build_bin\FFMPEG-SOURCE.txt

      - name: Build the AI pack
        shell: pwsh
        run: |
          python -m pip install --target build_ai --no-compile -r requirements-ai.txt
          # the app already bundles these; the pack must use the app's copies
          Get-ChildItem build_ai -Directory | Where-Object { $_.Name -match '^(numpy|cv2|opencv|PIL|pillow|bin)' } |
            Remove-Item -Recurse -Force
          Get-ChildItem build_ai -Recurse -Directory -Filter __pycache__ | Remove-Item -Recurse -Force
          # Visual C++ runtime for onnxruntime/ctranslate2 on PCs that don't have it
          foreach ($dll in "msvcp140.dll","msvcp140_1.dll","msvcp140_2.dll","vcruntime140.dll","vcruntime140_1.dll","concrt140.dll") {
            $p = Join-Path $env:WINDIR "System32\$dll"
            if (Test-Path $p) { Copy-Item $p build_ai\ }
          }
          New-Item -ItemType Directory dist -Force | Out-Null
          Compress-Archive -Path build_ai\* -DestinationPath dist\Satsuma-AI-pack.zip
          "READY" | Set-Content build_ai\READY
          "{0:N0} MB AI pack" -f ((Get-Item dist\Satsuma-AI-pack.zip).Length / 1MB)
          # tell the app which pack it needs (by content) and what the zip's checksum is
          $id = python -c "import hashlib,sys,numpy; d=open('requirements-ai.txt','rb').read()+f'{sys.version_info[:2]} numpy{numpy.__version__.split(chr(46))[0]}'.encode(); print(hashlib.sha256(d).hexdigest()[:12])"
          $sha = (Get-FileHash dist\Satsuma-AI-pack.zip -Algorithm SHA256).Hash.ToLower()
          "AIPACK_ID = `"$id`"" | Add-Content version.py
          "AIPACK_SHA256 = `"$sha`"" | Add-Content version.py
          Get-Content version.py

      - name: Build Satsuma.exe
        run: |
          python packaging/version_info.py
          pyinstaller packaging/satsuma.spec --noconfirm --distpath dist --workpath build

      - name: Add FFmpeg and license files
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist\Satsuma\bin -Force | Out-Null
          Copy-Item build_bin\* dist\Satsuma\bin\
          Copy-Item LICENSE, README.md dist\Satsuma\

      - name: Smoke test (the built .exe, with the AI pack)
        env:
          SATSUMA_AIPACK_DIR: ${{ github.workspace }}\build_ai
        run: python tests/smoke_test.py --exe dist/Satsuma/Satsuma.exe --ai

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=$env:VERSION /DNumVersion=$env:NUMVERSION packaging\installer.iss
          Compress-Archive -Path dist\Satsuma\* -DestinationPath dist\Satsuma-portable.zip

      - name: Update test (installed Satsuma starts the installer, closes, and comes back)
        shell: pwsh
        run: |
          $log = "$env:APPDATA\Satsuma\satsuma.log"
          $setupLog = "$env:TEMP\Satsuma-update.log"
          Remove-Item $log, $setupLog -ErrorAction SilentlyContinue
          $copy = "$env:RUNNER_TEMP\Satsuma-Setup-test.exe"
          Copy-Item dist\Satsuma-Setup.exe $copy
          # the installed app picks this up and runs the same hand-off as a real update
          $env:SATSUMA_UPDATE_TEST = $copy
          $p = Start-Process dist\Satsuma-Setup.exe -PassThru -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$env:RUNNER_TEMP\first-install.log"
          $p.WaitForExit()
          Remove-Item Env:\SATSUMA_UPDATE_TEST
          $deadline = (Get-Date).AddSeconds(240)
          $starts = 0
          do {
            Start-Sleep -Seconds 3
            $starts = @(Select-String -Path $log -Pattern '\(--install\)' -ErrorAction SilentlyContinue).Count
          } until ($starts -ge 2 -or (Get-Date) -gt $deadline)
          Start-Sleep -Seconds 3
          "---- satsuma.log"; Get-Content $log -ErrorAction SilentlyContinue
          "---- installer log (tail)"; Get-Content $setupLog -Tail 40 -ErrorAction SilentlyContinue
          $ok = Select-String -Path $setupLog -Pattern 'Installation process succeeded' -Quiet -ErrorAction SilentlyContinue
          Get-Process Satsuma -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $ok) { throw "The update installer did not finish" }
          if ($starts -lt 2) { throw "Satsuma did not start again after the update" }
          "Update hand-off works: installer finished and Satsuma restarted"

      - uses: actions/upload-artifact@v4
        with:
          name: Satsuma-${{ env.VERSION }}
          path: |
            dist/Satsuma-Setup.exe
            dist/Satsuma-portable.zip
            dist/Satsuma-AI-pack.zip

      - name: Publish release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          name: Satsuma ${{ env.VERSION }}
          body_path: .github/RELEASE_NOTES.md
          files: |
            dist/Satsuma-Setup.exe
            dist/Satsuma-portable.zip
            dist/Satsuma-AI-pack.zip

      - name: Submit the new version to winget
        if: github.event_name == 'release'
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if (-not $env:WINGET_TOKEN) { "No WINGET_TOKEN secret - skipping winget (see packaging/winget/README.md)"; exit 0 }
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          .\wingetcreate.exe update KassemAlharakeh.Satsuma --version $env:VERSION `
            --urls "https://github.com/kalharakeh/satsuma/releases/download/v$($env:VERSION)/Satsuma-Setup.exe" `
            --submit --token $env:WINGET_TOKEN
